; PlatformIO project config -- e-paper reader
;
; usage:
;   .\build.ps1 -Target 29 -Board s3        (2.9 inch + ESP32-S3)
;   .\build.ps1 -Board s3                   (4.2 inch + ESP32-S3)
;
; switch screen/board with the env, NOT with command-line -D (unsupported)
[platformio]
default_envs = esp32-c3

[env:esp32-c3]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D EPD_MODEL=42
    -D BOARD_SEL=1
monitor_filters = esp32_exception_decoder, time

; 2.9 inch 296x128 + C3
[env:esp32-c3-29]
extends   = env:esp32-c3
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D EPD_MODEL=29
    -D BOARD_SEL=1

; ESP32-S3 + PSRAM (N16R8): product build
[env:esp32-s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D EPD_MODEL=42
    -D BOARD_SEL=2
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
monitor_filters = esp32_exception_decoder, time

; 2.9 inch 296x128 + S3
[env:esp32-s3-29]
extends   = env:esp32-s3
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D EPD_MODEL=29
    -D BOARD_SEL=2
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; 4.26 inch 800x480 + S3
[env:esp32-s3-426]
extends   = env:esp32-s3
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D EPD_MODEL=426
    -D BOARD_SEL=2
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
