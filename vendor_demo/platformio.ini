; Vendor demo (waveshare-e-Paper / EPD_2in9_V2) rebuilt for ESP32-S3 + 2.9" panel
; Library code copied from the seller package, logic untouched; only:
;   * DEV_Config.h pin numbers  -> S3 wiring (CS10 DC9 RST8 BUSY7 DIN11 CLK12)
;   * EPD_2IN9_V2_ReadBusy()    -> 20 s cap added (vendor waits forever on BUSY)
[platformio]
default_envs = s3-29-vendor

[env:s3-29-vendor]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = ../firmware/partitions_16mb.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
monitor_filters = esp32_exception_decoder, time
